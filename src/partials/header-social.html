<li>
  <a
    class="social-link"
    href="{=$url}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="{=$label}"
  >
    <img
      class="social-icon-default"
      src="./img/header/{=$network}-dark.svg"
      width="20"
      height="20"
      alt=""
    />
    <img
      class="social-icon-hover"
      src="./img/header/{=$network}-accent.svg"
      width="20"
      height="20"
      alt=""
    />
  </a>
</li>
