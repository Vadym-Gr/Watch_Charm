<section class="hero section" aria-labelledby="hero-title">
  <div class="container">
    <div class="hero-top">
      <div class="hero-copy">
        <h1 id="hero-title" class="hero-title">
          Welcome to our <span class="hero-title-accent">collection</span> of
          premium watches
        </h1>
        <p class="hero-description">
          Our watches are not just timepieces, but also an expression of your
          personality and lifestyle. From classic designs to modern ones, we
          have a watch to suit every taste and occasion.
        </p>
      </div>

      <div class="hero-side">
        <ul class="hero-avatars" aria-hidden="true">
          <load src="partials/hero-avatar.html" number="1" />
          <load src="partials/hero-avatar.html" number="2" />
          <load src="partials/hero-avatar.html" number="3" />
        </ul>
        <a class="hero-scroll" href="#about-us">Scroll down</a>
      </div>
    </div>

    <div class="hero-image photo-frame">
      <picture>
        <source
          media="(min-width: 1280px)"
          srcset="./img/hero/desktop.webp 1x, ./img/hero/desktop@2x.webp 2x"
          width="1150"
          height="500"
        />
        <source
          media="(min-width: 768px)"
          srcset="./img/hero/tablet.webp 1x, ./img/hero/tablet@2x.webp 2x"
          width="704"
          height="520"
        />
        <img
          src="./img/hero/mobile.webp"
          srcset="./img/hero/mobile.webp 1x, ./img/hero/mobile@2x.webp 2x"
          width="335"
          height="366"
          alt="Black premium wristwatch suspended between textured rocks"
          fetchpriority="high"
        />
      </picture>
    </div>
  </div>
</section>
