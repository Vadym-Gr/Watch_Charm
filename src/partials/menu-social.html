<li>
  <a
    class="social-link"
    href="{=$url}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="{=$label}"
  >
    <picture>
      <source
        media="(min-width: 768px)"
        srcset="./img/header/{=$network}-light-tablet.svg"
      />
      <img
        src="./img/header/{=$network}-light-mobile.svg"
        width="18"
        height="18"
        alt=""
      />
    </picture>
  </a>
</li>
