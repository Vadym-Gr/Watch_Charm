<picture>
  <source
    media="(min-width: 768px)"
    srcset="
      ./img/sale/{=$slug}-view-large.webp    1x,
      ./img/sale/{=$slug}-view-large@2x.webp 2x
    "
    width="328"
    height="398"
  />
  <img
    src="./img/sale/{=$slug}-view-mobile.webp"
    srcset="
      ./img/sale/{=$slug}-view-mobile.webp    1x,
      ./img/sale/{=$slug}-view-mobile@2x.webp 2x
    "
    width="235"
    height="285"
    alt="{=$alt}"
    loading="lazy"
    decoding="async"
  />
</picture>
